<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">MEJOR COMBO</span>
          <span class="value" id="best-combo">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LÍNEAS MÁX.</span>
          <span class="value" id="best-lines">0</span>
        </div>

        <div class="panel-section">
          <span class="label">RECORDS</span>
          <ol class="leaderboard" id="leaderboard-list"></ol>
          <button id="reset-records-btn">Reiniciar records</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry-section" class="name-entry hidden">
          <label for="player-name-input" class="label">Tu nombre</label>
          <div class="name-entry-row">
            <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="submit-score-btn">Guardar</button>
          </div>
        </div>

        <div id="overlay-leaderboard-section" class="panel-section overlay-leaderboard hidden">
          <span class="label">RECORDS</span>
          <ol class="leaderboard" id="overlay-leaderboard-list"></ol>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
